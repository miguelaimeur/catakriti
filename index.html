<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TÍTULO DE LA WEB ACTUALIZADO -->
    <title>Cata 10 Aniversario Kritical Club</title>
    <style>
        /* Estilos base y reset */
        body, html { margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background:#111; 
            color:#fff; 
            padding:20px; 
            line-height: 1.6; 
            position: relative; /* Necesario para el posicionamiento de las hojas */
        }

        .container { max-width:700px; margin:auto; position: relative; z-index: 10; /* Asegura que el contenido esté por encima del fondo */ }
        
        /* Cabecera adaptada para el título y el botón */
        .header-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }
        h1 { margin: 0; color: #2ecc71; font-size: 1.8em; }
        
        /* Estilo del botón RANKING */
        .btn-ranking { 
            background: transparent; 
            color: #2ecc71; 
            border: 2px solid #2ecc71; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-weight: bold; 
            text-decoration: none; 
            transition: 0.3s; 
            text-align: center;
        }
        .btn-ranking:hover { 
            background: #2ecc71; 
            color: #000; 
            transform: translateY(-2px); 
        }

        .card { background:#222; padding:20px; border-radius:12px; margin-top:15px; border: 1px solid #333; }
        h2 { border-bottom: 2px solid #2ecc71; padding-bottom: 5px; margin-top: 0; }
        input, textarea, button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; box-sizing: border-box; }
        input, textarea { background: #333; color: #fff; border: 1px solid #444; }
        button { background:#2ecc71; color:#000; font-weight:bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #27ae60; transform: translateY(-2px); }
        .rating { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .rating button { flex:1 0 15%; background:#444; color:#fff; padding: 8px; margin-top: 0; }
        .rating button.active { background:#2ecc71; color:#000; }
        .small { font-size:0.85em; color:#bbb; margin-top: 4px; }
        .nota-destacada { font-size: 1.5em; color: #2ecc71; font-weight: bold; }
        .status { margin-top:15px; padding:12px; border-radius:8px; display:none; text-align: center; font-weight: bold; }
        .status.success { background:#2ecc71; color:#000; }
        .status.error { background:#e74c3c; color:#fff; }
        .status.info { background:#3498db; color:#fff; }
        .status.show { display:block; }

        /* --- ESTILOS PARA EL FONDO ANIMADO DE HOJAS --- */
        #weed-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Por detrás del contenido */
            overflow: hidden;
            pointer-events: none; /* No interfiere con los clics */
        }

        .leaf {
            position: absolute;
            width: 30px; /* Tamaño base */
            height: 30px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="%232ecc71"><path d="M473.1 366c-3.1 6.3-9 10.9-15.6 12.8-31 9.1-84.5 15.6-136.2-7 19.3-13.6 37.1-28.8 52.8-45 4 8.7 8.2 16.9 12.5 24.3 11 19.2 24 33.3 35.8 40.6 8 4.9 16.4 12.4 19 20.3 3.9 12.1-3 26.5-16.1 33.2-3.8 1.9-8.1 2.9-12.4 2.9-11 0-21.4-6.3-25.9-17-4.1-9.9-1.9-20.4-1.9-30.8 0-14 3.7-27.1 10.6-38 12 18.9 26.3 34.6 37.4 44.1 6.1 5.3 15.1 7.2 22.8 4.3 15-5.6 20.2-24.1 10.8-37.1zM286.6 448c-32.9 6-111.4 13-176.4-38.3-22.9-18.1-40.2-40.1-51.4-64.8-13.7-30.3-17.7-64.7-11.9-99.4 15.6-94.6 92.4-159 178.6-160.7 73.1-1.5 137 40.7 167 101.4 17.6 35.5 24.3 76.7 19.8 118.8l-.8 11-.1 1c-.1 2-.1 4-.1 6-.2 3.1-.3 6.1-.5 9.1-.5 7.8-1.1 15.6-1.9 23.3l-.2 2.3c-.6 5.5-1.3 11.1-2.1 16.6-8.5 60.1-34.9 109.8-77.9 146l-4.5 3.8-36.8 30.9-.9 1.1-12.8 13.9c-4.9 5.8-13 7.8-19.9 4.7zM368.1 183c27 15.2 55.4 17.1 82.2 11 11.4-2.6 21.6 3.6 25 15.1 3.5 11.5-2.6 23.3-13.9 26.9-39.7 12.5-74.6 6.1-105.7-17-15.1-11.2-18.4-25.8-18.6-39.6-.3-19.1 4.5-37 12.8-51.9 9.9 14 20.8 28.5 26.9 46.1 4.3 12.6 13 23.2 24.8 29.8 11.3 6.3 22.4 12.1 33.2 20.6 15.1 11.9 20.8 31 11.5 45.4-8.8 13.7-27 16.4-40 5.6-12-10-23.7-23.6-32.9-40.2-.4.1-.7.2-1.1.2.7-18.2-1.1-35.3-5.3-51.4-.4-1.3-.7-2.6-1.1-3.9zM182.1 35.2c-5.4-14.7-19.6-23.3-33.8-21.6l-20.9 2.5c-15.1 1.8-26.6 15-25.7 30.1.7 11.7 3.9 22.6 8.9 31.8 11.3 20.6 27.6 37.1 47.9 49 33.9 19.9 76.6 23.4 117.8 17.5l-.8-21c-.4-11.8-1.6-23.3-3.6-34.6l-.3-1.6c-.2-.9-.4-1.9-.6-2.8-1.8-8.2-4.1-16.1-6.9-23.7-9.5-25.2-22.6-48.3-38.9-68.5-7.7-9.5-18.6-16-30.8-18.1zm212.8 382l-.4.3c-28 23.9-61.9 43.1-97.7 54.4-6.3 2-12.7 3.1-19.2 3.3l-.1.1-26.1.8c-20 1-38.3 14-43.2 33.8l-.2 1-6.1 24.6c-4.3 17.1-1.3 35.2 8.7 49.3l.2.3 21 28.3c10.3 13.8 27 20.9 42.6 19.3s28.1-12.1 32.4-27.8l6.1-22.3 30.3-108c14.6 11.9 29.8 21.6 45.7 28.9l.4.1 45.7 21c33 15.2 68.7 15.2 97.4 3 17.2-7.3 25-27.4 17-43.9zm-317-101.4c12.3 8.3 16.3 24.7 9 37.6l-13 22.8c-21.4-13-39.7-32.3-52.8-             background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.15; /* Muy sutil */
            will-change: transform;
            animation: drift linear infinite;
        }

        /* Variaciones de tamaño y opacidad para dar profundidad */
        .leaf.lg { width: 45px; height: 45px; opacity: 0.1; }
        .leaf.sm { width: 20px; height: 20px; opacity: 0.2; }

        @keyframes drift {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
            }
            100% {
                /* Cae y se desplaza horizontalmente un poco */
                transform: translateY(110vh) translateX(20px) rotate(360deg);
            }
        }
    </style>
</head>
<body>

<!-- CONTENEDOR DEL FONDO ANIMADO -->
<div id="weed-background">
    <!-- Las hojas se generan aquí mediante JavaScript -->
</div>

<div class="container">
    
    <div class="header-container">
        <!-- TÍTULO PRINCIPAL ACTUALIZADO -->
        <h1>🌿 Cata 10 Aniversario<br>Kritical Club</h1>
        <a href="https://www.catakriti.com/ranking" class="btn-ranking">RANKING</a>
    </div>

    <div class="card" id="fase1">
        <h2>Paso 1: Información</h2>
        <input id="nombre" placeholder="Tu nombre / Catador">
        <input id="variedad" placeholder="Nombre de la Variedad">
        <button onclick="iniciar()">Empezar cata</button>
    </div>

    <div class="card" id="fase2" style="display: none;">
        <h2>Paso 2: Evaluación</h2>
        <div id="criterios"></div>

        <div style="margin-top:20px;">
            <h3>Comentarios adicionales</h3>
            <textarea id="comentarios" rows="3" placeholder="Notas sobre el sabor, ceniza, curado..."></textarea>
            
            <h3 style="margin-top:15px;">Valoración económica</h3>
            <input id="precio" type="number" placeholder="¿Cuánto pagarías? (€)">
        </div>

        <div class="card" style="text-align: center; background: #1a1a1a;">
            <span>Nota Final Estimada:</span><br>
            <span id="notaFinal" class="nota-destacada">0.00</span>
        </div>

        <button id="btnGuardar" onclick="guardar()">Finalizar y Guardar en Drive</button>
        <div id="status" class="status"></div>
    </div>

    <h2>📊 Historial Reciente</h2>
    <div id="historial"></div>
</div>

<script>
    // --- SCRIPT PARA GENERAR HOJAS DE FONDO ---
    function createLeaves() {
        const bg = document.getElementById('weed-background');
        const leafCount = 20; // Número de hojas en pantalla
        
        for (let i = 0; i < leafCount; i++) {
            const leaf = document.createElement('div');
            
            // Asignar clases aleatorias de tamaño
            const sizeClass = ['sm', '', 'lg'][Math.floor(Math.random() * 3)];
            leaf.className = `leaf ${sizeClass}`;
            
            // Posición horizontal aleatoria
            leaf.style.left = Math.random() * 100 + 'vw';
            
            // Retraso de animación y duración aleatorios para que no vayan a la vez
            leaf.style.animationDelay = (Math.random() * 20) + 's';
            leaf.style.animationDuration = (Math.random() * 20 + 15) + 's'; // Entre 15 y 35 segundos

            bg.appendChild(leaf);
        }
    }
    // Iniciar generación de hojas al cargar
    createLeaves();
    // ------------------------------------------

    // Constantes y Lógica Original (Sin cambios, excepto GOOGLE_SHEETS_URL por seguridad en ejemplo)
    const GOOGLE_SHEETS_URL = "tú_url_aquí"; // Reemplaza por la URL original si la necesitas en este entorno

    const pesos = { "Aspecto": 1, "Olor": 1.5, "Olor tras grinder": 1.5, "Sabor": 2, "Punch": 2, "Pegada": 2, "Efecto": 2 };
    const criteriosLista = [
        ["Aspecto", "Visual, resina, densidad de tricomas"],
        ["Olor", "Intensidad y perfil aromático en seco"],
        ["Olor tras grinder", "Explosión de aromas al picar"],
        ["Sabor", "Fidelidad al olor y limpieza en boca"],
        ["Punch", "Rapidez del primer impacto"],
        ["Pegada", "Potencia máxima alcanzada"],
        ["Efecto", "Calidad y duración de la experiencia"]
    ];

    let puntuaciones = {};
    let catas = JSON.parse(localStorage.getItem("catas")) || [];

    function iniciar() {
        const nom = document.getElementById("nombre").value;
        const varid = document.getElementById("variedad").value;
        
        if(!nom || !varid) {
            alert("Por favor, introduce tu nombre y la variedad.");
            return;
        }
        
        document.getElementById("fase1").style.display = "none";
        document.getElementById("fase2").style.display = "block";
        
        const criteriosDiv = document.getElementById("criterios");
        criteriosDiv.innerHTML = "";
        puntuaciones = {};

        criteriosLista.forEach(c => {
            let bloque = document.createElement("div");
            bloque.style.marginBottom = "15px";
            bloque.innerHTML = `<h3>${c[0]}</h3><div class="small">${c[1]}</div>`;
            
            let rating = document.createElement("div");
            rating.className = "rating";
            for(let i=1; i<=10; i++) {
                let b = document.createElement("button");
                b.textContent = i;
                b.type = "button";
                b.onclick = () => {
                    [...rating.children].forEach(x => x.classList.remove("active"));
                    b.classList.add("active");
                    puntuaciones[c[0]] = i;
                    calcular();
                };
                rating.appendChild(b);
            }
            bloque.appendChild(rating);
            criteriosDiv.appendChild(bloque);
        });
    }

    function calcular() {
        let total = 0, pesoTotal = 0;
        for(let k in puntuaciones) { total += puntuaciones[k] * pesos[k]; pesoTotal += pesos[k]; }
        let nota = pesoTotal > 0 ? (total / pesoTotal).toFixed(2) : "0.00";
        document.getElementById("notaFinal").textContent = nota;
        return nota;
    }

    function guardar() {
        if(Object.keys(puntuaciones).length < criteriosLista.length) {
            alert("Por favor, puntúa todos los criterios antes de guardar.");
            return;
        }

        const btn = document.getElementById("btnGuardar");
        btn.disabled = true;
        btn.innerText = "Enviando datos...";

        const nuevaCata = {
            fecha: new Date().toLocaleString('es-ES'),
            nombre: document.getElementById("nombre").value,
            variedad: document.getElementById("variedad").value,
            precio: document.getElementById("precio").value || "0",
            nota: calcular(),
            comentarios: document.getElementById("comentarios").value,
            ...puntuaciones 
        };

        catas.unshift(nuevaCata);
        localStorage.setItem("catas", JSON.stringify(catas));
        renderHistorial();

        mostrarStatus("⏳ Conectando con Google Sheets...", "info");

        if (GOOGLE_SHEETS_URL === "tú_url_aquí") {
             mostrarStatus("❌ Error: No se ha configurado la URL de Google Sheets.", "error");
             btn.disabled = false;
             btn.innerText = "Reintentar Guardar";
             return;
        }

        fetch(GOOGLE_SHEETS_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(nuevaCata)
        })
        .then(() => {
            mostrarStatus("✅ ¡Guardado con éxito en la nube!", "success");
            setTimeout(() => {
                location.reload();
            }, 2500);
        })
        .catch(err => {
            console.error(err);
            mostrarStatus("❌ Error al enviar. Se guardó localmente.", "error");
            btn.disabled = false;
            btn.innerText = "Reintentar Guardar";
        });
    }

    function mostrarStatus(mensaje, tipo) {
        const statusDiv = document.getElementById("status");
        statusDiv.textContent = mensaje;
        statusDiv.className = "status show " + tipo;
    }

    function renderHistorial() {
        const historialDiv = document.getElementById("historial");
        if (!historialDiv) return;
        historialDiv.innerHTML = "";
        catas.slice(0, 5).forEach(c => {
            let item = document.createElement("div");
            item.className = "card";
            item.style.background = "#1a1a1a";
            item.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <strong>${c.variedad}</strong>
                    <span class="nota-destacada" style="font-size:1.1em">${c.nota}</span>
                </div>
                <div class="small">${c.fecha}</div>
            `;
            historialDiv.appendChild(item);
        });
    }

    renderHistorial();
</script>
</body>
</html>
